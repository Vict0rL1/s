# Cada noche: los backtests de los siete deportes sobre la base publicada, y un aviso (el job
# falla) si el log loss de un modelo publicado empeora más que la tolerancia de
# experiments/tolerancias.json respecto a experiments/backtest_metrics.json (lo commiteado).
name: Backtests nocturnos

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch-data
      - name: Referencia (lo commiteado)
        run: cp experiments/backtest_metrics.json /tmp/backtest_metrics.referencia.json
      - name: Backtests
        run: |
          npm run backtest:fb
          npm run backtest:bb
          npm run backtest:bsb
          npm run backtest:naf
          npm run backtest:nhl
          npm run backtest:ufc
          npm run backtest
      - name: ¿Regresión?
        run: node scripts/regresion-backtests.mjs /tmp/backtest_metrics.referencia.json experiments/backtest_metrics.json
