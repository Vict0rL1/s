<!--
  The app's mark is the thing the app actually is: a probability bar.

  Not a ball. There are five sports now and picking one ball to stand for all of
  them was already wrong when there were two — the old icon was a tennis ball in
  a lime that no longer exists anywhere in the palette. What every tab really has
  in common is this: a row of segments in the shared, validated colours saying
  how likely each outcome is. Blue is the home side, aqua the draw, orange the
  away side, exactly as on every card.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#14161b"/>
  <rect x="3.5" y="12.5" width="11.5" height="7" rx="3.5" fill="#3987e5"/>
  <rect x="16.5" y="12.5" width="5" height="7" fill="#199e70"/>
  <rect x="23" y="12.5" width="5.5" height="7" rx="2.75" fill="#d95926"/>
</svg>
